<style>
:root{--navy:#17324d;--blue:#2463a6;--bg:#f3f6fa;--text:#263746;--muted:#5c6670;--line:#dce5ee;--red:#b42318}

const safety={

"폭염·더위":["물을 자주 마시고 더운 시간대의 격렬한 활동을 줄입니다.","어지러움·두통·메스꺼움이 있으면 활동을 멈추고 시원한 곳에서 도움을 요청합니다.","의식 변화나 심한 증상이 나타나면 119에 신고합니다.","차 안이나 밀폐된 더운 공간에 사람을 혼자 두지 않습니다."],

"식품 위생":["식사 전과 화장실 사용 후 비누로 손을 씻습니다.","날것과 바로 먹는 음식을 구분하고 조리 도구를 깨끗하게 사용합니다.","상온에 오래 둔 음식이나 냄새·색이 이상한 음식은 먹지 않습니다.","식중독이 의심되면 보호자에게 알리고 증상이 심하면 의료 도움을 받습니다."],
"온라인·학교폭력 예방":["괴롭힘이나 위협을 당하면 혼자 해결하려 하지 말고 믿을 만한 어른에게 알립니다.","온라인에서 개인정보·주소·비밀번호를 공개하지 않습니다.","위협적인 메시지나 게시물은 맞대응하거나 퍼뜨리지 말고 증거를 보존해 보호자·교사에게 알립니다.","학교폭력 신고·상담은 117, 청소년 상담은 1388에 문의할 수 있습니다."]

const home=document.getElementById('home'),menu=document.getElementById('menu'),detail=document.getElementById('detail'),quiz=document.getElementById('quiz');
function hideAll(){[home,menu,detail,quiz].forEach(e=>e.classList.add('hidden'))}

let qi=0,score=0,answered=false,quizSession=[];
function startQuiz(){qi=0;score=0;quizSession=[...quizData].sort(()=>Math.random()-0.5).slice(0,5);showQuestion()}
function showQuestion(){hideAll();quiz.classList.remove('hidden');answered=false;if(qi>=quizSession.length){quiz.innerHTML=`<h2>퀴즈 완료 🎉</h2><p>총 ${quizSession.length}문제 중 <b>${score}문제</b>를 맞혔어요.</p><button class="back" onclick="showHome()">메인 메뉴로 돌아가기</button>`;return}const q=quizSession[qi];quiz.innerHTML=`<button class="back" onclick="showHome()">← 메인 메뉴</button><h2>안전 상식 퀴즈　${qi+1}/${quizSession.length}</h2><p><b>${q.q}</b></p><div id="options">${q.options.map((o,i)=>`<button class="option" onclick="answer(${i})">${i+1}. ${o}</button>`).join('')}</div><div id="feedback" aria-live="polite"></div>`}
function answer(choice){if(answered)return;answered=true;const q=quizSession[qi];if(choice===q.a)score++;document.querySelectorAll('.option').forEach((b,i)=>{b.disabled=true;if(i===q.a)b.style.borderColor='#238636'});document.getElementById('feedback').innerHTML=`<div class="feedback"><b>${choice===q.a?'정답입니다!':'해설을 확인하세요.'}</b><br>${q.e}</div><button class="cardbtn" onclick="qi++;showQuestion()">${qi===quizSession.length-1?'결과 보기':'다음 문제'}　›</button>`}
